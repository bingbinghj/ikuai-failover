name: 清理旧部署镜像

on:
  workflow_dispatch:

permissions:
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: 删除包含旧部署模板的镜像版本
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_OWNER: ${{ github.repository_owner }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          owner = os.environ['PACKAGE_OWNER']
          base = f'https://api.github.com/users/{owner}/packages/container/ikuai-failover/versions'
          obsolete = {'sha-29dc3f0', 'sha-471dac8', 'sha-58a3779', 'sha-7d2dbf0'}
          def call(url, method='GET'):
              request = urllib.request.Request(url, method=method, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              with urllib.request.urlopen(request, timeout=30) as response:
                  data = response.read()
                  return json.loads(data) if data else None
          removed = 0
          page = 1
          versions = []
          while True:
              batch = call(f'{base}?per_page=100&page={page}')
              versions.extend(batch)
              if len(batch) < 100:
                  break
              page += 1
          for version in versions:
              tags = set(version.get('metadata', {}).get('container', {}).get('tags', []))
              if tags & obsolete:
                  if 'latest' in tags:
                      raise RuntimeError('请先成功发布新镜像，再清理旧版本。')
                  call(f"{base}/{version['id']}", 'DELETE')
                  removed += 1
          print(f'已删除 {removed} 个旧镜像版本。')
          PY
